<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Membuka Apple Music...</title>
<style>
  body {
    font-family: -apple-system, Roboto, sans-serif;
    background: #0a0a0a;
    color: #f5f5f5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
  }
  .btn {
    display: inline-block;
    background: #fc3c44;
    color: #fff;
    font-size: 18px;
    font-weight: bold;
    padding: 18px 36px;
    border-radius: 999px;
    text-decoration: none;
    margin-top: 24px;
    border: none;
    cursor: pointer;
  }
  .icon {
    font-size: 48px;
    margin-bottom: 12px;
  }
  .note {
    color: #999;
    font-size: 13px;
    margin-top: 20px;
    max-width: 280px;
  }
</style>
</head>
<body>
  <div class="icon">🎵</div>
  <p>Tap tombol di bawah untuk buka lagunya di Apple Music</p>
  <a class="btn" id="open-btn" href="#">Buka di Apple Music</a>
  <p class="note">Chrome mengharuskan tap manual untuk membuka aplikasi lain — tag NFC tidak bisa memicu ini otomatis.</p>

  <script>
    // Ganti bagian ini kalau mau redirect ke lagu/album lain
    var albumPath = "id/album/musician/1894533111?i=1894533119&l=id&ls";
    var packageName = "com.apple.android.music";
    var playStoreFallback = "https://play.google.com/store/apps/details?id=" + packageName;

    // Format ini mengikuti contoh resmi dari integrasi Shazam -> Apple Music
    var intentUrl = "intent://music.apple.com/" + albumPath +
      "#Intent;scheme=http;package=" + packageName +
      ";action=android.intent.action.VIEW" +
      ";S.browser_fallback_url=" + encodeURIComponent(playStoreFallback) + ";end";

    var btn = document.getElementById("open-btn");
    btn.href = intentUrl;

    btn.addEventListener("click", function (e) {
      e.preventDefault();
      window.location.href = intentUrl;
    });
  </script>
</body>
</html>
